# --- systems ------------------------------------------------------------------
# disk_gb: the weight files the engine reads, summed from the Hugging Face API
# (https://huggingface.co/api/models/<repo>?blobs=true), read 2026-10-23.
# v2t: "default" (what v2t ships), "opt-in" (a backend you can choose), or leave it out.
# engine "cloud" marks a hosted reference with no weights on disk (no disk_gb); its rows
# come from grid.score_wispr_flow, not from a grid cell.

[systems.parakeet-v3]
model = "parakeet-tdt-0.6b-v3"
engine = "parakeet-mlx"
precision = "bf16"
disk_gb = 2.508
