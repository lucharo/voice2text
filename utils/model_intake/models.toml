# Speech-to-text model intake registry. Read by intake.py beside it.
#
# Two tables (`short` is the name drawn on the charts):
#   [models.<id>]   one set of weights as its creator published it: who made it, size,
#                   licence, and the error rates other people report for it.
#   [systems.<id>]  one row of utils/asr_grid/grid.py's SYSTEMS (same key): that model
#                   run through one engine at one precision, what it costs on disk, and
#                   whether v2t ships it.
#
# Onboarding a model: add its [models] entry with every reported number you can find
# (each one names a [sources] entry), add the system to grid.py's SYSTEMS and run its
# cells, then add the [systems] entry here. The notebook picks both up on its next load.
# Quote a key that holds a dot ([models."qwen3-asr-1.7b"]): TOML reads a bare dot as nesting.
#
# Reported metrics use the grid's set names where the dataset is the same one:
#   ls-clean, ls-other   LibriSpeech test (we score a seeded 150-clip sample of each)
#   fleurs-es            FLEURS Spanish test (we score 150 clips of es_419)
#   ami-ihm              the leaderboard's AMI-Cleaned: headset microphones, clips under 1 s removed
#   earnings22-aa        the leaderboard's Earnings22-Cleaned-AA (6 calls, corrected transcripts)
#   oasr-avg             Open ASR Leaderboard English short-form default average (its list of
#                        datasets changes; eleven, two private, since 26 October 2026)
#   aa-wer               Artificial Analysis AA-WER v2 index (AgentTalk, VoxPopuli, Earnings22)
# Values are WER in percent.

[sources.oasr_en]
name = "Open ASR Leaderboard, English short-form, version 26-10-2026"
url = "https://huggingface.co/spaces/hf-audio/open_asr_leaderboard"
read = "2026-10-27"
note = "Full test sets, the model's reference implementation on a GPU, its own scorer (utils/asr_grid/oasr). Read from the Space; its results datasets now ask for a sign-in."

[sources.oasr_es]
name = "Open ASR Leaderboard, multilingual, Spanish, FLEURS column, version 26-10-2026"
url = "https://huggingface.co/spaces/hf-audio/open_asr_leaderboard"
read = "2026-10-27"
note = "FLEURS es_419 test, references without parentheses."

[sources.card]
name = "The model's own card"
url = "https://huggingface.co/models"
read = "2026-10-27"
note = "Numbers its makers report; each entry's note says how they were scored."

[sources.aa]
name = "Artificial Analysis Speech to Text leaderboard"
url = "https://artificialanalysis.ai/speech-to-text"
read = "2026-10-23"
note = "AA-WER v2, non-streaming. Measured through a hosted API, which can differ from the open weights."

[sources.bark_card]
name = "Underdog Bark 3.0 model card"
url = "https://huggingface.co/ConwayResearch/Underdog-Bark-3.0"
read = "2026-10-27"
note = "The creator's own run of the Open ASR Leaderboard scoring code on the full English test sets; not on the leaderboard yet."

