name: testflight

# Every push to main that touches the iPhone app archives it and uploads it to
# TestFlight; the Internal group gets every build. Run it by hand from the
# Actions tab to upload main without a change. Runs in the `testflight`
# environment, which only main may deploy to, so a pull request never sees the
# signing secrets. One-time setup: scripts/ci-testflight-secrets.sh.
#
# Waiting for Apple to list the build is its own job, so when Apple is slow and
# it times out, "Re-run failed jobs" only waits again: it neither rebuilds nor
# uploads a new build number. A run is green only once Apple lists the build as
# VALID; a build Apple refuses can also stay unlisted.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "!ios/Tests/**"
      - "!ios/UITests/**"
      - "!ios/Packages/*/Tests/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight

jobs:
  keyboard-latency:
    name: Keyboard latency (informational)
    runs-on: macos-26
    timeout-minutes: 60
    # Shared-host wall-clock timings vary; retain the benchmark and its 8 ms
    # budget, but report it independently of correctness and signing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: brew install xcodegen
      - run: ios/setup.sh
      - name: Measure per-key latency with debug logging
        working-directory: ios/Packages/V2TKeyboardCore
        run: swift test -c release -Xswiftc -enable-testing --no-parallel --filter perKeyCostWithTheLogOn

  upload:
    runs-on: macos-26  # the Xcode 26 the app targets; macos-latest may lag behind it
    timeout-minutes: 60
    environment: testflight
    outputs:
      build: ${{ steps.build.outputs.number }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: brew install xcodegen
      - name: Generate the project and the lexicons
        run: ios/setup.sh
      - name: Test the keyboard engines
        working-directory: ios/Packages/V2TKeyboardCore
        # Run correctness and accuracy checks serially so the real timer can fire.
        # The absolute per-key timing benchmark runs in its own informational job.
        run: swift test -c release -Xswiftc -enable-testing --no-parallel --skip perKeyCostWithTheLogOn
      - name: Import the Apple Distribution identity into a throwaway keychain
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/testflight.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/testflight.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/testflight.keychain-db"
          printf '%s' "$APPLE_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/testflight.keychain-db" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/testflight.keychain-db" > /dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/testflight.keychain-db" login.keychain-db
          security find-identity -v -p codesigning "$RUNNER_TEMP/testflight.keychain-db"
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Pick the build number
        id: build
        working-directory: ios
        # One above the last upload, by hand or from here, with no version-bump
        # commits. The concurrency group means the last run's build is listed by now,
        # unless its wait timed out: then this number can repeat the unlisted build's.
        run: echo "number=$(uv run --quiet tools/asc.py next-build)" >> "$GITHUB_OUTPUT"
      - name: Install the App Store profiles
        working-directory: ios
        run: uv run --quiet tools/asc.py profiles "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive -project V2T.xcodeproj -scheme V2T -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/V2T.xcarchive" -xcconfig tools/AppStore.xcconfig \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} -quiet
      - name: Upload to App Store Connect
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/V2T.xcarchive" \
            -exportOptionsPlist tools/ExportOptions-manual.plist -exportPath "$RUNNER_TEMP/V2T-export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  wait:
    name: Wait for Apple to accept the build
    needs: upload
    runs-on: ubuntu-latest  # only API calls
    timeout-minutes: 70  # asc.py gives up after WAIT_MINUTES (60) and says what to do
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Wait for build ${{ needs.upload.outputs.build }}
        working-directory: ios
        run: uv run --quiet tools/asc.py wait "${{ needs.upload.outputs.build }}"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
