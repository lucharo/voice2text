name: appstore

# Pushing an ios-v<version> tag submits the newest processed TestFlight build of that version for App Store
# review, and Apple releases it as soon as it approves; ios-v<version>-<build> submits that build instead. There
# is no manual approval step, so pushing the tag is the release decision, as with the v* tags in release.yml
# (which publish the Mac app). The tag's message becomes "What's New", which the first release does not have:
#
#   git tag -a ios-v1.1 -m "The mic key works after a phone call" && git push origin ios-v1.1
#
# Rerunning a failed run picks up where it stopped; rerunning a successful one changes nothing. Run it by hand
# from the Actions tab for a dry run, which only reads and lists what the listing still lacks. Uses the
# `testflight` environment, which only main and ios-v* tags may deploy to.

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to check, e.g. ios-v1.0 or ios-v1.0-104. A dry run: it submits nothing."
        required: true
        default: ios-v1.0

permissions:
  contents: read

concurrency:
  group: appstore
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest  # only API calls: the build is already on TestFlight
    timeout-minutes: 15
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Read What's New from the tag's message
        if: github.event_name == 'push'
        run: |
          # checkout keeps only the commit, so fetch the tag object itself to read its message
          git fetch --force --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/whats-new.txt"
          else
            : > "$RUNNER_TEMP/whats-new.txt"  # a lightweight tag: no message, which only the first release may have
          fi
          cat "$RUNNER_TEMP/whats-new.txt"
      - name: Submit for review
        if: github.event_name == 'push'
        working-directory: ios
        run: uv run --quiet tools/asc.py release "$TAG" --whats-new "$RUNNER_TEMP/whats-new.txt"
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ios
        run: uv run --quiet tools/asc.py status && uv run --quiet tools/asc.py release "$TAG" --dry-run
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
