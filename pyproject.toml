[project]
name = "voice2text"
version = "0.5.16"
description = "Local, MLX-first voice-to-text with LLM cleanup"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy<2.4",
    "scipy",
    "pynput",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "loguru",
    "parakeet-mlx>=0.5.2",  # transcribe_stream + the config attributes streaming reads
    "coremltools>=9",  # the default parakeet-coreml backend (Neural Engine)
    "mlx-lm",
]

# Mac-first: Parakeet (STT) + mlx-lm (cleanup) ship in core, so a bare
# `uv tool install voice2text` just works on Apple Silicon. Whisper is an
# optional alternative STT backend.
[project.optional-dependencies]
whisper = ["mlx-whisper"]
# Qwen3-ASR (backend = "qwen3-asr"): mlx-audio is small, but from 0.6 it pins mlx to one
# exact version, so it stays out of the default install
qwen = ["mlx-audio>=0.5.7"]
coreml = []  # coremltools is a core dependency since parakeet-coreml became the default

[project.scripts]
v2t = "v2t.cli:main"

[dependency-groups]
dev = ["hatch", "mlx-whisper", "ruff"]
docs = ["zensical>=0.0.62"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v2t"]
exclude = ["v2t/bench.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/benchmarks",
    "/justfile",
    "/pyproject.toml",
    "/tests",
    "/v2t",
]
