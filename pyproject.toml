[project]
name = "voice2text"
version = "0.3.0"
description = "Local, MLX-first voice-to-text with LLM cleanup"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy<2.4",
    "scipy",
    "pynput",
    "loguru",
    "parakeet-mlx",
    "mlx-lm",
]

# Mac-first: Parakeet (STT) + mlx-lm (cleanup) ship in core, so a bare
# `uv tool install voice2text` just works on Apple Silicon. Whisper is an
# optional alternative STT backend.
[project.optional-dependencies]
whisper = ["mlx-whisper"]

[project.scripts]
v2t = "v2t.cli:main"

[dependency-groups]
dev = ["hatch", "mlx-whisper", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v2t"]
exclude = ["v2t/bench.py"]

[tool.hatch.build.targets.wheel.force-include]
"swiftbar/v2t.5s.sh" = "swiftbar/v2t.5s.sh"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/benchmarks",
    "/justfile",
    "/pyproject.toml",
    "/swiftbar",
    "/tests",
    "/v2t",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
ollama = "*"
# nowplaying-cli not on conda-forge, install via: brew install nowplaying-cli

[tool.pixi.pypi-dependencies]
voice2text = { path = ".", editable = true }

[tool.pixi.tasks]
v2t = "v2t"
