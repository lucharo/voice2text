[project]
site_url = "https://v2t.luischav.es/"
site_name = "voice2text"
site_description = "Voice-as-an-Interface, done simply: local push-to-talk dictation for Apple Silicon Macs."
site_author = "Luis Chaves Rodriguez"
repo_url = "https://github.com/lucharo/voice2text"
repo_name = "lucharo/voice2text"
docs_dir = "docs/public"
edit_uri = "edit/main/docs/public/"
extra_css = ["stylesheets/docs.css"]
extra_javascript = ["javascripts/benchmarks.js"]

nav = [
  { "voice2text" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = "guide.md" },
  { "iPhone and iPad" = "iphone.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "config.toml" = "reference/config.md" },
  ] },
  { "Help" = "faq.md" },
  { "Privacy" = "privacy.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lucharo/voice2text"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
